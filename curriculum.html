<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North American Excellence - Curriculum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- gatekeeper.js inclusion will be handled at a higher level or integrated into routing for production -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Specific styles for curriculum.html to override/complement styles.css */
        main {
            flex-grow: 1;
            padding: 4rem 0;
            text-align: center;
        }

        .curriculum-section h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 3.5rem;
            color: var(--navy);
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .curriculum-section h2::after {
            content: '';
            display: block;
            width: 80%;
            height: 4px;
            background-color: var(--gold);
            margin: 15px auto 0;
            border-radius: 2px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .curriculum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
            margin-top: 4rem;
        }

        .lesson-card {
            background-color: var(--lesson-card-bg);
            border: 2px solid var(--border-color);
            border-top: 8px solid var(--gold);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow-md);
            padding: 2.5rem;
            text-align: left;
            transition: transform 0.3s cubic-bezier(.34,.84,.61,1.06), box-shadow 0.3s ease-in-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
            position: relative;
            overflow: hidden;
        }

        .lesson-card::before {
            content: attr(data-icon);
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 3rem; /* Larger animal icon */
            opacity: 0.1;
            z-index: 0;
            line-height: 1;
            color: var(--gold);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .lesson-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: var(--box-shadow-lg);
            border-color: var(--gold); /* Highlight border on hover */
        }
        .lesson-card:hover::before {
            opacity: 0.2;
            transform: scale(1.1) rotate(5deg);
        }

        .lesson-card h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            color: var(--navy);
            margin-bottom: 0.8rem;
            line-height: 1.3;
            position: relative;
            z-index: 1;
        }
        .lesson-card h3 .lesson-id {
            font-size: 0.9em;
            opacity: 0.7;
        }

        .lesson-card p {
            font-family: 'Lato', sans-serif;
            font-size: 1.1rem;
            color: var(--dark-gray);
            flex-grow: 1;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .lesson-card .strategy-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--navy);
            color: var(--white);
            padding: 0.7rem 1.4rem;
            border-radius: var(--border-radius-sm);
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: auto;
            border: 1px solid var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: var(--box-shadow-sm);
            position: relative;
            z-index: 1;
        }
        .strategy-tag .animal-icon-sm {
            font-size: 1.2rem;
            line-height: 1;
        }

        footer {
            margin-top: 5rem; /* More spacing for curriculum page */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5rem;
            }
            .curriculum-section h2 {
                font-size: 2.5rem;
            }
            .curriculum-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .lesson-card {
                padding: 1.5rem;
                min-height: unset;
            }
            .lesson-card h3 {
                font-size: 1.5rem;
            }
            .lesson-card p {
                font-size: 1rem;
            }
            .lesson-card .strategy-tag {
                font-size: 0.8rem;
                padding: 0.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>North American Excellence</h1>
            <p>Comprehensive Curriculum for Mastery</p>
        </div>
    </header>

    <main>
        <section class="curriculum-section">
            <div class="container">
                <h2>Our Fun Animal Strategies Path</h2>
                <div class="curriculum-grid" id="lessons-grid">
                    <!-- Lesson cards will be dynamically loaded here -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p class="footer-logo">North American Excellence</p>
            <p>&copy; 2026 North American Excellence. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const strategyIcons = {
            "Tiger Tones": "🐯",
            "Elephant Echoes": "🐘",
            "Monkey Morphs": "🐒",
            "Peacock Pitches": "🦚",
            "Panda Puzzles": "🐼",
            "Dragon Decisions": "🐉"
        };

        document.addEventListener('DOMContentLoaded', async () => {
            // For local testing, gatekeeper.js is assumed to be handled at a higher level (e.g., routing) or temporarily bypassed
            // In a production environment, uncomment a check similar to this:
            // const hasAccess = await checkAccess();
            // if (!hasAccess) return; // Stop rendering if no access and redirection has not occurred

            try {
                const response = await fetch('lessons.json');
                const lessons = await response.json();
                const lessonsGrid = document.getElementById('lessons-grid');

                lessons.forEach(lesson => {
                    const lessonCard = document.createElement('div');
                    lessonCard.classList.add('lesson-card');
                    lessonCard.setAttribute('data-icon', lesson.animal_icon || '');
                    lessonCard.onclick = () => { window.location.href = `lesson_template.html?lesson=${lesson.id}`; };
                    lessonCard.innerHTML = `
                        <h3><span class="lesson-id">Lesson ${lesson.id}:</span> ${lesson.title}</h3>
                        <p>${lesson.description}</p>
                        <span class="strategy-tag"><span class="animal-icon-sm">${lesson.animal_icon}</span> ${lesson.strategy}</span>
                    `;
                    lessonsGrid.appendChild(lessonCard);
                });
            } catch (error) {
                console.error('Error fetching lessons.json:', error);
                const lessonsGrid = document.getElementById('lessons-grid');
                lessonsGrid.innerHTML = '<p>Failed to load curriculum. Please try again later. (Check browser console for details)</p>';
            }
        });
    </script>
</body>
</html>
