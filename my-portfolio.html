<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Pathway Canada</title>
    <meta http-equiv="refresh" content="0; url=academic-records.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        // Seamless instant client redirect preserving query params and hashes
        const target = 'academic-records.html' + window.location.search + window.location.hash;
        window.location.replace(target);
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0b1329;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .redirect-box {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-family: 'Lexend', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        a {
            color: #60a5fa;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>Loading Your Portfolio...</h2>
        <p>Redirecting to your student academic monograph and course records. If not redirected automatically, <a href="academic-records.html">click here</a>.</p>
    </div>
</body>
</html>
